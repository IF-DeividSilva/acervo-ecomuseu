name: Sync Metadados Principal

on:
  push:
    branches: [main]
    paths:
      - 'Metadados/metadados_conteudos/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild metadados_principal.json
        run: |
          python3 << 'EOF'
          import json, glob

          folder = "Metadados/metadados_conteudos"
          files = glob.glob(f"{folder}/metadados_conteudo_*.json")  # glob atualizado

          ids = []
          for f in files:
              with open(f, encoding="utf-8") as fp:
                  data = json.load(fp)
                  ids.append(data["id_conteudo_pk"])

          ids.sort()

          # 2 id_pk por conteúdo (a duplicata é para o conteudo de audio)
          documentos = []
          pk = 1
          for cid in ids:
              documentos.append({"id_pk": pk,     "id_conteudo": cid})
              documentos.append({"id_pk": pk + 1, "id_conteudo": cid})
              pk += 2

          with open("Metadados/metadados_principal.json", "w", encoding="utf-8") as fp:
              json.dump({"documentos": documentos}, fp, ensure_ascii=False, indent=4)

          print(f" Sincronizados {len(ids)} conteúdos → {len(documentos)} entradas")
          EOF

      - name: Commit atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Metadados/metadados_principal.json
          git diff --staged --quiet || git commit -m "chore: sync metadados_principal [skip ci]"
          git push