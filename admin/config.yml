backend:
  name: github
  repo: IF-DeividSilva/acervo-ecomuseu
  branch: main
  base_url: https://oauth-proxy.deivid-sgalvao.workers.dev

media_folder: "Dados/Artigos"
public_folder: "/Dados/Artigos"

collections:

  # --- Acervo Principal ---
  - name: "principal"
    label: "Acervo Principal"
    format: json
    files:
      - file: "Metadados/metadados_principal.json"
        label: "Metadados Principal"
        name: "principal"
        fields:
          - name: documentos
            label: "Documentos"
            widget: list
            fields:
              - { name: id_pk, label: "ID PK", widget: number }
              - { name: id_conteudo, label: "ID Conteúdo", widget: number }

  # --- Conteúdos individuais ---
  - name: "conteudos"
    label: "Conteúdos"
    folder: "Metadados/metadados_conteudos"
    format: json
    extension: json
    create: true
    slug: "conteudo_{{id_conteudo_pk}}"
    fields:
      - { name: id_conteudo_pk, label: "ID", widget: number }
      - { name: titulo, label: "Título", widget: string }
      - { name: autor, label: "Autor", widget: string, default: "Anônimo" }
      - { name: ano, label: "Ano", widget: string, default: "Não informado" }
      - name: categoria
        label: "Categoria"
        widget: select
        options:
          - Artigo
          - Notícia
          - Depoimento
          - Publicidade
          - Fotografia
          - Selo
          - Logotipo
          - Carta
          - Ofício
          - Legenda
          - Entrevista
          - Conteúdos Descartados
      - { name: assunto, label: "Assunto", widget: string, default: "Sem assunto" }
      - name: arquivo
        label: "Arquivo de Mídia"
        widget: file
        media_folder: "Dados/Artigos"
        public_folder: "/Dados/Artigos"
        allow_multiple: false
      - name: WCAG
        label: "Critérios WCAG"
        widget: list
        fields:
          - { name: WCAG_id, label: "WCAG ID", widget: number }
      - name: conteudo
        label: "Descrição / Conteúdo"
        widget: text       # text = caixa grande, sem markdown

  # --- WCAG ---
  - name: "wcag"
    label: "Critérios WCAG"
    format: json
    files:
      - file: "Metadados/metadados_WCAG.json"
        label: "WCAG"
        name: "wcag"
        fields:
          - name: criterios
            label: "Critérios"
            widget: list
            fields:
              - { name: WCAG_id_pk, label: "ID", widget: number }
              - { name: WCAG_categoria, label: "Categoria", widget: string }
              - { name: WCAG_id_subcategoria, label: "Subcategoria", widget: string }