backend:
  name: github
  repo: IF-DeividSilva/acervo-ecomuseu
  branch: main
  base_url: https://oauth-proxy.deivid-sgalvao.workers.dev

media_folder: "Dados"
public_folder: "/Dados"

collections:

  # --- Conteúdos individuais ---
  - name: "conteudos"
    label: "Conteúdos"
    folder: "Metadados/metadados_conteudos"
    format: json
    extension: json
    create: true
    slug: "conteudo_{{id_conteudo_pk}}"
    media_folder: "Dados/{{fields.categoria}}"
    public_folder: "/Dados/{{fields.categoria}}"
    fields:
      - { name: id_conteudo_pk, label: "ID", widget: number }
      - { name: titulo, label: "Título", widget: string }
      - { name: autor, label: "Autor", widget: string, default: "Anônimo" }
      - { name: ano, label: "Ano", widget: string, default: "Não informado" }
      - name: categoria
        label: "Categoria (selecione antes de fazer upload!)"
        widget: select
        default: "Artigos"
        options:
          - Artigos
          - Audios
          - Cartas
          - Conteúdos Descartados
          - Depoimentos
          - Entrevistas
          - Fotografias
          - Legendas
          - Logotipos
          - Noticias
          - Ofícios
          - Publicidades
          - Selos
      - { name: assunto, label: "Assunto", widget: string, default: "Sem assunto" }
      - name: arquivo
        label: "Arquivo de Mídia"
        widget: file
        multiple: false
      - name: WCAG
        label: "Critérios WCAG"
        widget: list
        fields:
          - { name: WCAG_id, label: "WCAG ID", widget: number }
      - name: conteudo
        label: "Descrição / Conteúdo"
        widget: text