backend:
  name: github
  repo: IF-DeividSilva/acervo-ecomuseu
  branch: main
  base_url: https://oauth-proxy.deivid-sgalvao.workers.dev

media_folder: "Dados"      
public_folder: "/Dados"

collections:

  - name: "conteudos"
    label: "Conteúdos"
    folder: "Metadados/metadados_conteudos"
    format: json
    extension: json
    create: true
    slug: "metadados_conteudo_{{id_conteudo_pk}}"  
    media_folder: "Dados/{{fields.categoria}}"
    public_folder: ""
    fields:
      - { name: id_conteudo_pk, label: "ID", widget: number }
      - { name: titulo, label: "Título", widget: string }
      - { name: autor, label: "Autor", widget: string, default: "Anônimo" }
      - { name: ano, label: "Ano", widget: string, default: "Não informado" }
      - name: categoria
        label: "Categoria (selecione antes de fazer upload!)"
        widget: select
        default: "Artigos"
        options:
          - Artigos
          - Audios
          - Cartas
          - Conteúdos Descartados
          - Depoimentos
          - Entrevistas
          - Fotografias
          - Legendas
          - Logotipos
          - Noticias
          - Ofícios
          - Publicidades
          - Selos
      - { name: assunto, label: "Assunto", widget: string, default: "Sem assunto" }
      - name: arquivo
        label: "Arquivo de Mídia"
        widget: file
        multiple: false
# O campo de upload para audiodescrição foi desabilitado, pois foi usado a API Speech-to-Text do Google 
# para fazer a leitura automaticamente da audiodescrição dos documentos.
# para habilitar o upload de áudio, descomente o bloco abaixo e comente o campo "arquivo" acima.
#      - name: audio                        
#        label: "Audiodescrição (.wav)"
#        widget: file
#        multiple: false
#        accept: ".wav"
      - name: WCAG                      
        label: "Critérios WCAG"
        widget: list
        min: 1
        max: 1                          # sempre um único objeto na lista
        fields:
          - name: WCAG_id
            label: "WCAG IDs"
            widget: select
            multiple: true              # salva como array de números
            options:
              - { label: "1 - Áudio e vídeo - Audiodescrição para vídeo", value: 1 }
              - { label: "2 - Áudio e vídeo - Controle de áudio", value: 2 }
              - { label: "3 - Apresentação - Design responsivo", value: 3 }
              - { label: "4 - Apresentação - Ordem de apresentação", value: 4 }
              - { label: "5 - Botões e controles - Semântica de botão", value: 5 }
              - { label: "6 - Botões e controles - Propósito do botão", value: 6 }
              - { label: "7 - Botões e controles - Área de acionamento mínima", value: 7 }
              - { label: "8 - Botões e controles - Controles com retorno", value: 8 }
              - { label: "9 - Cabeçalhos - Semântica de cabeçalho", value: 9 }
              - { label: "10 - Cabeçalhos - Uso de cabeçalhos", value: 10 }
              - { label: "11 - Cabeçalhos - Estrutura de cabeçalhos", value: 11 }
              - { label: "12 - Codificação semântica - Título da página", value: 12 }
              - { label: "13 - Codificação semântica - Idioma da página", value: 13 }
              - { label: "14 - Codificação semântica - Ordem de leitura", value: 14 }
              - { label: "15 - Codificação semântica - Mensagens de status", value: 15 }
              - { label: "16 - Codificação semântica - Semântica de componentes customizados", value: 16 }
              - { label: "17 - Entrada de Dados - Rótulo de campo associado", value: 17 }
              - { label: "18 - Imagens - Texto alternativo para imagens de conteúdo", value: 18 }
              - { label: "19 - Imagens - Texto alternativo para imagens funcionais", value: 19 }
              - { label: "20 - Interação por teclado - Acessibilidade por teclado total", value: 20 }
              - { label: "21 - Interação por teclado - Indicador de foco visível", value: 21 }
              - { label: "22 - Interação por teclado - Ordem de foco previsível", value: 22 }
              - { label: "23 - Interação por teclado - Armadilha de foco", value: 23 }
              - { label: "24 - Links e navegação - Propósito do link no contexto", value: 24 }
              - { label: "25 - Links e navegação - Links para sites externos", value: 25 }
              - { label: "26 - Regiões - Semântica de região", value: 26 }
              - { label: "27 - Regiões - Regiões únicas", value: 27 }
      - name: conteudo
        label: "Descrição / Conteúdo"
        widget: text

  - name: "wcag"
    label: "Critérios WCAG"
    format: json
    hide: true
    files:
      - file: "Metadados/metadados_WCAG.json"
        label: "WCAG"
        name: "wcag"
        fields:
          - name: criterios
            label: "Critérios"
            widget: list
            fields:
              - { name: WCAG_id_pk, label: "ID", widget: number }
              - { name: WCAG_categoria, label: "Categoria", widget: string }
              - { name: WCAG_id_subcategoria, label: "Subcategoria", widget: string }
